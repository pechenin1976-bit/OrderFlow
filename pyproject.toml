[project]
name = "orderflow"
version = "0.1.0"
description = "Multi-exchange order flow and liquidity density for Quantilan"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "numpy>=2.4.1",
    "python-dotenv>=1.2.1",
]

[project.scripts]
orderflow = "orderflow_core:main"

[tool.uv]
managed = true
